[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fab-yield"
version = "0.1.0"
description = "Fab Yield: an RL environment where an agent tunes a semiconductor process recipe for yield"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["fab_yield"]

[tool.setuptools.package-data]
fab_yield = ["docs/*.md"]
